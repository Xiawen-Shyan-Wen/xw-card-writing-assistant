name: Attest release assets

# 为已发布 Release 的附件生成来源证明（artifact attestation）
# 每次发布新 Release 自动运行；也可在 Actions 页面手动触发补跑（填 tag）。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "要生成证明的 Release tag（例如 1.0.2）"
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: t
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG="${{ github.event.inputs.tag }}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.t.outputs.tag }}" --dir dist --repo "${{ github.repository }}"
          ls -la dist

      - name: Generate attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"
